version: "0.1.3.0"
targetAbi: "12.0.0.0"
framework: "net10.0"
owner: "DD00031"
overview: "Cast to Google Cast devices from Jellyfin's built-in cast interface, on every client including iOS/iPadOS/macOS."
description: >
  Discovers Google Cast (Chromecast) devices on the local network and exposes each one as a
  session in Jellyfin's existing "Play On" / cast interface. Casting is handed off to Jellyfin's
  own cast receiver app - the same one Chrome users already use - so transcoding, subtitle
  handling and codec negotiation (including transcoding H.265/HEVC sources that older Chromecast
  hardware can't decode) work the same way they already do for Chrome/Android users, but from any
  Jellyfin client, including the iOS/iPadOS/macOS apps that have no Google Cast SDK of their own.
category: "General"
artifacts:
- "Jellyfin.Plugin.Chromecast.dll"
changelog: >
  0.1.3.0: Subtitles now work, including external .srt files: the subtitle selector no longer
  disappears when connected to a Chromecast, and the chosen track is actually used. The unstable
  receiver is now the default (the stable one can't load external subtitle files yet) - existing
  installs that saved this setting keep their choice. Playback starts in about a second when the
  item page was opened while connected (the receiver now starts early and stays running between
  casts), and the Jellyfin screen on the TV closes after Stop or after 3 minutes idle.

  0.1.2.0: Fixes switching subtitle or audio tracks mid-cast from the remote-control UI, which was
  previously a silent no-op. Also fixes a release-versioning bug that could leave an update stuck
  showing the old version as active with Disable/Uninstall failing - 0.1.1.0 is pulled from this
  repository for that reason, please install 0.1.2.0 directly.

  0.1.0.0: First public test release. Confirmed working against real Chromecast hardware and the
  iOS/macOS apps: discovery, casting, H.265/HEVC transcoding, play/pause/unpause/stop/seek/skip/
  volume/mute, queueing and queue navigation, live playback state in the remote control screen,
  picking up an in-progress cast from a second device, and access token cleanup on stop.
