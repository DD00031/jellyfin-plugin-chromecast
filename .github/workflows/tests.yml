name: Tests

# Builds the plugin and runs the unit tests on every push and pull request.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build the plugin
        run: dotnet build -c Release Jellyfin.Plugin.Chromecast/Jellyfin.Plugin.Chromecast.csproj

      - name: Run the tests
        run: dotnet test tests/Jellyfin.Plugin.Chromecast.Tests
